<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fit No.1</title>
<style>
:root{--bg:#F5F5F7;--card:#FFF;--text:#1D1D1F;--sub:#86868B;--border:#E5E5EA;--divider:#F2F2F7;--green:#4CAF50;--orange:#FF9500;--blue:#007AFF;--red:#FF3B30}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:var(--bg);color:var(--text);font-size:15px;-webkit-font-smoothing:antialiased}
.page{max-width:420px;margin:0 auto;min-height:100vh;padding-bottom:90px}
.nav{position:sticky;top:0;z-index:10;background:rgba(245,245,247,.9);backdrop-filter:blur(10px);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:.5px solid var(--border)}
.nav-t{font-size:17px;font-weight:600}
.card{background:var(--card);margin:12px 16px;padding:16px;border-radius:16px}
.c-title{font-size:14px;color:var(--sub);margin-bottom:8px}
.c-val{font-size:28px;font-weight:700}
.c-unit{font-size:14px;color:var(--sub)}
.mode-bar{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:16px;margin:12px 16px;cursor:pointer}
.mode-emoji{font-size:24px}
.mode-label{font-size:17px;font-weight:600;flex:1}
.mode-desc{font-size:12px;color:var(--sub);margin-top:2px}
.macro-row{display:flex;gap:8px;margin:0 16px 12px}
.macro-item{flex:1;background:var(--card);border-radius:14px;padding:14px;text-align:center}
.macro-val{font-size:15px;font-weight:600}
.macro-lbl{font-size:11px;color:var(--sub);margin-top:4px}
.btn-row{display:flex;gap:10px;margin:0 16px 12px}
.btn{flex:1;padding:14px;border-radius:14px;text-align:center;font-size:15px;font-weight:500;border:none;cursor:pointer;background:var(--card)}
.btn.primary{background:var(--text);color:#fff}
.btn.outline{background:transparent;border:1px solid var(--border)}
.btn.danger{color:var(--red)}
.btn.sm{padding:8px 14px;font-size:13px;flex:0}
.input{padding:12px 14px;border:1px solid var(--border);border-radius:12px;font-size:15px;background:var(--card);outline:none;width:100%}
.input:focus{border-color:var(--blue)}
.input-row{display:flex;gap:8px}
.flex{display:flex}.g8{gap:8px}.w100{width:100%}
.text-center{text-align:center}.text-sub{color:var(--sub);font-size:13px}.text-sm{font-size:13px}.text-right{text-align:right}
.ml-auto{margin-left:auto}
.big-num{font-size:48px;font-weight:700;letter-spacing:-1px}
.chip-row{display:flex;gap:6px;overflow-x:auto;padding:4px 0;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:7px 14px;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.active{background:var(--text);color:#fff;border-color:var(--text)}
.food-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:.5px solid var(--divider)}
.food-row:last-child{border-bottom:none}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:rgba(245,245,247,.95);backdrop-filter:blur(10px);border-top:.5px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom,0)}
.tab{flex:1;text-align:center;padding:10px 0 6px;font-size:11px;color:var(--sub);cursor:pointer}
.tab.active{color:var(--green)}
.tab-icon{font-size:22px;display:block;margin-bottom:2px}
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 20px;border-radius:24px;font-size:14px;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.3);display:flex;align-items:flex-end;justify-content:center;z-index:100}
.modal-box{background:var(--card);border-radius:20px 20px 0 0;padding:20px 16px 30px;width:100%;max-width:420px;max-height:85vh;overflow-y:auto}
.modal-title{font-size:17px;font-weight:600;margin-bottom:16px;text-align:center}
.hidden{display:none!important}
.bold{font-weight:600}
.unit-label{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:11px;pointer-events:none}
.unit-wrap{position:relative}
.progress-bar{height:8px;background:var(--divider);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:width .3s}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<div class="page" id="app"></div>
<div class="bottom-nav" id="nav"></div>
<div class="toast" id="toast"></div>
<script>
// ── State & Utils ──
const T=()=>new Date().toISOString().slice(0,10)
const now=()=>new Date().toTimeString().slice(0,5)
const $=s=>document.querySelector(s)
const $$=s=>document.querySelectorAll(s)
const api=(u,o={})=>fetch(u,{headers:{'Content-Type':'application/json'},...o}).then(r=>r.ok?r.json():Promise.reject(r))
const toast=m=>{let t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
const U=(n,u)=>`<span class="unit-wrap"><input class="input sm" value="${n}" style="padding-right:24px">${u?`<span class="unit-label">${u}</span>`:''}</span>`

const MODES={cardio:{l:'有氧日',e:'🏃',d:'高碳水供能',bg:'#E8F0FE',c:'#007AFF'},
  strength:{l:'无氧日',e:'💪',d:'高蛋白修复',bg:'#FFF3E0',c:'#FF9500'},
  happy:{l:'Happy日',e:'😊',d:'休息恢复',bg:'#E8F5E9',c:'#4CAF50'},
  cheat:{l:'放纵日',e:'🎉',d:'随便吃',bg:'#FFEBEE',c:'#FF3B30'}}

let S={tab:'home',user:{},meals:[],workouts:[],dishes:[],goals:{},mode:'happy',measurements:[],water:[],waterTarget:2500,waterDrinks:[]}

// ── Nav ──
function nav(){
  let h='';['home','diet','workout','me'].forEach(t=>{
    let ic={home:'📊',diet:'🍽️',workout:'💪',me:'👤'},lb={home:'首页',diet:'饮食',workout:'运动',me:'我的'}
    h+=`<div class="tab ${S.tab===t?'active':''}" data-t="${t}"><span class="tab-icon">${ic[t]}</span>${lb[t]}</div>`
  })
  $('#nav').innerHTML=h
  $$('.tab').forEach(t=>t.onclick=()=>{S.tab=t.dataset.t;render()})
}
function render(){S.tab==='home'?home():S.tab==='diet'?diet():S.tab==='workout'?workout():me();nav()}
function renderMacroBar(label,val,target,color){
  let pct=target>0?Math.min(150,Math.round(val/target*100)):0
  let barColor=pct<80?'var(--blue)':pct<=100?'var(--green)':'var(--orange)'
  return `<div class="macro-item"><span class="macro-val" style="color:${color}">${val}</span><span class="macro-lbl">${label} / ${target}g</span><div class="progress-bar" style="height:4px;margin-top:6px"><div class="progress-fill" style="width:${Math.min(pct,100)}%;background:${barColor}"></div></div><span class="text-sm" style="color:${barColor}">${pct}%</span></div>`
}

// ── Home ──
function home(){
  let m=S.mode||'happy',c=MODES[m],g=S.goals||{}
  let eaten=S.mealsTotal||0,wb=(S.workouts||[]).reduce((s,w)=>s+(w.calories||0),0)
  let deficit=eaten-(g.tdee||2000)-wb,ds=deficit<-300?'热量缺口':deficit>300?'热量盈余':'热量平衡',dc=deficit<-300?'var(--green)':deficit>300?'var(--red)':'var(--orange)'
  let eff=S.water.reduce((s,w)=>s+(w.effective_ml||w.amount||0),0),raw=S.water.reduce((s,w)=>s+(w.amount||0),0)
  let wt=S.waterTarget||2500,pct=Math.min(100,Math.round(eff/wt*100))
  let bc=pct<30?'var(--red)':pct<70?'var(--orange)':'var(--green)'
  let lw=S.measurements&&S.measurements[0]?S.measurements[0].weight:(S.user.current_weight||0)
  $('#app').innerHTML=`
    <div class="nav"><span class="nav-t">Fit No.1</span><span class="text-sub">${T()}</span></div>
    <div class="mode-bar" style="background:${c.bg}" onclick="switchMode()"><span class="mode-emoji">${c.e}</span><div><span class="mode-label" style="color:${c.c}">${c.l}</span><span class="mode-desc">${c.d} · 点击切换</span></div></div>
    <div class="card text-center"><span class="text-sub">今日热量缺口</span><br><span class="big-num" style="color:${dc}">${deficit>0?'+':''}${deficit}</span><span class="c-unit"> kcal</span><br><span style="color:${dc};font-size:14px;font-weight:500">${ds}</span></div>
    <div class="macro-row">
      ${renderMacroBar('蛋白',Math.round(S.mealsProtein||0),g.protein||0,'var(--orange)')}
      ${renderMacroBar('碳水',Math.round(S.mealsCarbs||0),g.carbs||0,'var(--green)')}
      ${renderMacroBar('脂肪',Math.round(S.mealsFat||0),g.fat||0,'var(--blue)')}
    </div>
    <div class="card"><span class="c-title">💧 饮水 · ${pct}%</span>
      <div style="display:flex;align-items:baseline;gap:8px;margin:8px 0"><span class="c-val" style="font-size:28px">${eff}</span><span class="text-sub">/ ${wt} ml</span></div>
      ${raw!==eff?`<div class="text-sm text-sub" style="margin-bottom:4px">实际 ${raw}ml，等效纯水 ${eff}ml</div>`:''}
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${bc}"></div></div>
      <div class="input-row mt12" style="flex-wrap:wrap">
        <span class="unit-wrap" style="flex:1"><input class="input sm" id="w-amt" value="250" type="number" style="width:100%;text-align:center;font-size:18px;font-weight:600;padding-right:28px"><span class="unit-label">ml</span></span>
        <select class="input sm" id="w-type" onchange="toggleCustomDrink()" style="flex:1">${(S.waterDrinks||[]).map(d=>`<option>${d.name}</option>`).join('')}<option>其他</option></select>
        <input class="input sm hidden" id="w-custom" placeholder="饮品名" style="width:100px">
        <button class="btn primary sm" onclick="quickAddWater()" style="flex:0 0 50px">+</button>
      </div>
      <div class="text-sub text-sm mt4">${S.water&&S.water.length>0?S.water.slice(-3).reverse().map(w=>`<span style="cursor:pointer" onclick="undoWater(${w.id})">${w.drink_type} ${w.amount}ml${w.effective_ml!==w.amount?'→'+w.effective_ml+'ml':''} ✕</span>`).join(' · '):'今天还没喝水'}</div>
    <div class="flex g8 mt8"><button class="btn sm outline" onclick="quickWaterFixed(200)">💧 200ml</button><button class="btn sm outline" onclick="quickWaterFixed(350)">💧 350ml</button><button class="btn sm outline" onclick="quickWaterFixed(500)">💧 500ml</button></div>
    </div>
    <div class="btn-row"><button class="btn primary" onclick="S.tab='diet';render()">🍽️ 记录饮食</button><button class="btn primary" onclick="S.tab='workout';render()">💪 记录运动</button></div>
    ${lw?`<div class="card" onclick="S.tab='me';render()"><span class="c-title">最新体重</span><span class="c-val">${lw}kg</span></div>`:''}
  `
}

// ── Diet ──
function diet(){
  let tp={breakfast:'早餐',lunch:'午餐',dinner:'晚餐',snack:'加餐'},mb={breakfast:[],lunch:[],dinner:[],snack:[]}
  S.meals.forEach(m=>{if(mb[m.meal_type])mb[m.meal_type].push(m)})
  let h=`<div class="nav"><span class="nav-t">饮食</span><span class="text-sub">${T()}</span></div>
    <div class="card text-center"><span class="text-sub">今日摄入</span><br><span class="big-num">${S.mealsTotal||0}</span><span class="c-unit"> kcal</span></div>`
  Object.entries(tp).forEach(([t,lb])=>{
    let ml=mb[t]||[]
    h+=`<div class="card"><span class="c-title">${lb} · ${ml.length}餐</span>`
    if(!ml.length)h+=`<div class="text-sub" style="padding:8px 0">暂无记录</div>`
    else ml.forEach(m=>{
      let fs=[];try{fs=JSON.parse(m.foods)}catch(e){}
      let cal=fs.reduce((s,f)=>s+(f.calories||0),0),pro=fs.reduce((s,f)=>s+(f.protein||0),0)
      let dn=fs[0]?.dishName||fs.map(f=>f.name).join('+')
      h+=`<div class="food-row"><div><span>${m.time||''}</span><span class="text-sm bold" style="margin-left:8px">${dn}</span><div class="text-sm text-sub">${fs.map(f=>f.name+' '+f.amount+'g').join(' · ')}</div></div><div class="text-right"><span class="bold">${cal}kcal</span><br><span class="text-sm text-sub">蛋白${pro.toFixed(1)}g</span><br><button class="btn sm danger" onclick="delMeal(${m.id})">×</button></div></div>`
    })
    h+=`</div>`
  })
  h+=`<div style="padding:12px 16px"><button class="btn primary w100" onclick="addMealModal()">+ 添加饮食</button></div>`
  $('#app').innerHTML=h
}

// ── Workout ──
function workout(){
  let h=`<div class="nav"><span class="nav-t">运动</span><span class="text-sub">${T()}</span></div>`
  if(!S.workouts.length)h+=`<div class="card"><div class="text-sub text-center" style="padding:20px">暂无训练记录</div></div>`
  else S.workouts.forEach(w=>{
    let exs=w.exercises;if(typeof exs==='string')try{exs=JSON.parse(exs)}catch(e){exs=[]};if(!Array.isArray(exs))exs=[]
    let ic=w.type==='cardio'
    h+=`<div class="card"><span class="c-title">${w.start_time||''} · ${w.duration||0}分钟 · ${ic?'🏃 有氧':'💪 无氧'}</span><div class="mt8">${exs.map(e=>ic?`<span class="chip">${e.name||'有氧'}</span>`:`<span class="chip">${e.name} ${e.sets||0}组×${e.reps||0}次×${e.weight||0}kg</span>`).join(' ')}</div><div class="flex" style="justify-content:space-between;margin-top:8px"><span class="bold" style="color:var(--red)">-${w.calories||0} kcal</span><button class="btn sm danger" onclick="delWorkout(${w.id})">删除</button></div></div>`
  })
  h+=`<div style="padding:12px 16px"><button class="btn primary w100" onclick="addWorkoutModal()">+ 记录训练</button></div>`
  $('#app').innerHTML=h
}

// ── Me ──
function me(){
  let u=S.user||{},g=S.goals||{},lw=S.measurements&&S.measurements[0]?S.measurements[0]:{}
  let h=`<div class="nav"><span class="nav-t">我的</span></div>
    <div class="card text-center"><span style="font-size:22px;font-weight:700">${u.nickname||'健身者'}</span></div>
    <div class="card"><span class="c-title">身体数据</span>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px">
        <div><span class="text-sub">身高</span><br><span class="bold">${u.height||170}cm</span></div>
        <div><span class="text-sub">体重</span><br><span class="bold">${lw.weight||u.current_weight||70}kg</span></div>
        <div><span class="text-sub">目标</span><br><span class="bold">${u.target_weight||65}kg</span></div>
        <div><span class="text-sub">年龄</span><br><span class="bold">${new Date().getFullYear()-parseInt((u.birth_date||'1995').slice(0,4))}岁</span></div>
      </div>
      <button class="btn outline w100 mt12" onclick="editProfile()">编辑资料</button>
      <div class="input-row mt12">
        <span class="unit-wrap"><input class="input sm" id="wt-in" type="number" step="0.1" placeholder="68" style="padding-right:24px"><span class="unit-label">kg</span></span>
        <span class="unit-wrap"><input class="input sm" id="bf-in" type="number" step="0.1" placeholder="18" style="padding-right:24px"><span class="unit-label">%</span></span>
        <button class="btn primary sm" onclick="recordWeight()">记录</button>
      </div>
    </div>
    <div class="card"><span class="c-title">营养目标（${(MODES[S.mode]||MODES.happy).l}）</span>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px">
        <div><span class="text-sub">BMR</span><br><span class="bold">${g.bmr||0} kcal</span></div><div><span class="text-sub">TDEE</span><br><span class="bold">${g.tdee||0} kcal</span></div>
        <div><span class="text-sub">目标热量</span><br><span class="bold">${g.target_calories||0} kcal</span></div><div><span class="text-sub">蛋白</span><br><span class="bold">${g.protein||0}g</span></div>
        <div><span class="text-sub">碳水</span><br><span class="bold">${g.carbs||0}g</span></div><div><span class="text-sub">脂肪</span><br><span class="bold">${g.fat||0}g</span></div>
      </div>
    </div>`
  if(S.measurements&&S.measurements.length>1){
    h+=`<div class="card"><span class="c-title">体重趋势</span>`
    S.measurements.slice(0,10).reverse().forEach(m=>h+=`<div class="food-row"><span>${m.date}</span><span class="bold">${m.weight}kg</span>${m.body_fat?`<span class="text-sub">${m.body_fat}%</span>`:''}</div>`)
    h+=`</div>`
  }
  $('#app').innerHTML=h
}

// ── Water functions ──
function toggleCustomDrink(){document.getElementById('w-custom').classList.toggle('hidden',$('#w-type').value!=='其他')}
function quickWaterFixed(ml){
  let t=$('#w-type')?.value||'矿泉水'
  if(t==='其他'){t=$('#w-custom')?.value?.trim();if(!t)t='水'}
  api('/api/water',{method:'POST',body:JSON.stringify({date:T(),amount:ml,drink_type:t})}).then(()=>{loadWater().then(render);toast('+'+ml+'ml '+t)})
}
function quickAddWater(){
  let a=parseInt($('#w-amt')?.value||250),t=$('#w-type')?.value||'矿泉水'
  if(!a||a<10)return toast('请输入饮水量')
  if(t==='其他'){t=$('#w-custom')?.value?.trim();if(!t)return toast('请输入饮品名称')}
  api('/api/water',{method:'POST',body:JSON.stringify({date:T(),amount:a,drink_type:t})}).then(()=>{loadWater().then(render);toast(`+${a}ml ${t}`)})
}
function undoWater(id){api('/api/water/'+id,{method:'DELETE'}).then(()=>{loadWater().then(render);toast('已撤销')})}

// ── Data loading ──
function loadAll(){return Promise.all([loadUser(),loadMeals(),loadWorkouts(),loadDishes(),loadMeasurements(),loadWater(),loadWaterTarget()]).then(loadGoals)}
function loadUser(){return api('/api/user').then(u=>{S.user=u;S.mode=u.workout_type||'happy'})}
function loadMeals(){return api('/api/meals?date='+T()).then(ms=>{S.meals=ms;S.mealsTotal=0;S.mealsProtein=0;S.mealsCarbs=0;S.mealsFat=0;ms.forEach(m=>{try{JSON.parse(m.foods).forEach(f=>{S.mealsTotal+=f.calories||0;S.mealsProtein+=f.protein||0;S.mealsCarbs+=f.carbs||0;S.mealsFat+=f.fat||0})}catch(e){}});S.mealsTotal=Math.round(S.mealsTotal);S.mealsProtein=Math.round(S.mealsProtein);S.mealsCarbs=Math.round(S.mealsCarbs);S.mealsFat=Math.round(S.mealsFat)})}
function loadWorkouts(){return api('/api/workouts?date='+T()).then(ws=>{S.workouts=ws})}
function loadDishes(){return api('/api/dishes').then(ds=>{S.dishes=ds})}
function loadGoals(){let u=S.user||{};return api('/api/nutrition',{method:'POST',body:JSON.stringify({current_weight:u.current_weight||70,height:u.height||170,birth_date:u.birth_date||'1995-01-01',gender:u.gender||1,activity_level:u.activity_level||1.55,target_weight:u.target_weight||65,mode:S.mode})}).then(g=>{S.goals=g})}
function loadMeasurements(){return api('/api/measurements').then(ms=>{S.measurements=ms})}
function loadWater(){return api('/api/water?date='+T()).then(w=>{S.water=w})}
function loadWaterTarget(){let u=S.user||{};return api('/api/water-target',{method:'POST',body:JSON.stringify({weight:u.current_weight||70,activity_level:u.activity_level||1.55})}).then(d=>{S.waterTarget=d.target_ml;S.waterDrinks=d.drinks})}

// ── Mode switch ──
function switchMode(){
  let types=['cardio','strength','happy','cheat'],h=`<div class="modal-overlay" id="mode-m" onclick="$('#mode-m').remove()"><div class="modal-box" onclick="event.stopPropagation()" style="border-radius:20px"><div class="modal-title">选择今日模式</div>`
  types.forEach(t=>{let c=MODES[t];h+=`<div style="background:${c.bg};margin-bottom:8px;padding:14px 16px;border-radius:14px;display:flex;align-items:center;gap:10px;cursor:pointer" onclick="pickMode('${t}')"><span style="font-size:28px">${c.e}</span><div style="flex:1"><span style="font-size:16px;font-weight:600">${c.l}</span><span style="font-size:12px;color:var(--sub);display:block">${c.d}</span></div>${S.mode===t?'<span style="color:var(--green);font-size:20px">✓</span>':''}</div>`})
  h+=`</div></div>`
  document.body.insertAdjacentHTML('beforeend',h)
}
function pickMode(t){$('#mode-m').remove();S.mode=t;api('/api/user',{method:'POST',body:JSON.stringify({workout_type:t})});loadGoals().then(render)}
function delMeal(id){if(confirm('删除？'))api('/api/meals/'+id,{method:'DELETE'}).then(()=>loadAll().then(render))}
function delWorkout(id){if(confirm('删除？'))api('/api/workouts/'+id,{method:'DELETE'}).then(()=>loadAll().then(render))}

// ── Profile actions ──
function editProfile(){
  let u=S.user||{}
  $('#app').insertAdjacentHTML('beforeend',`<div class="modal-overlay" id="pf-m"><div class="modal-box"><div class="modal-title">编辑资料</div>

function takePhoto(){$('#mc-photo').click()}
function analyzePhoto(input){
  let file=input.files[0];if(!file)return
  let reader=new FileReader()
  reader.onload=function(e){
    let base64=e.target.result.split(',')[1]
    $('#mc-photo-img').src=e.target.result
    $('#mc-photo-img').style.cssText='width:100%;max-height:200px;object-fit:cover;border-radius:12px'
    showPhotoSkeleton()
    $('#mc-photo-slider').value=200
    $('#mc-photo-grams').textContent='200g'
    toast('AI 正在识别菜品...')
    let timer=setTimeout(()=>{toast('网络较慢，请稍候...')},5000)
    api('/api/analyze-photo',{method:'POST',body:JSON.stringify({image:base64})}).then(r=>{
      clearTimeout(timer)
      let name=r.name||'未识别菜品（点击修改）',grams=r.estimated_grams||200,conf=r.confidence||'medium'
      $('#mc-photo-name').textContent=name
      window._photoResult={name:name,estimated_grams:grams,ingredients:r.ingredients||[],confidence:conf,
        calories:r.calories||0,protein:r.protein||0,carbs:r.carbs||0,fat:r.fat||0}
      $('#mc-photo-conf').textContent='✅ '+(r.calories||0)+'kcal · 蛋白'+(r.protein||0)+'g · 碳水'+(r.carbs||0)+'g · 脂肪'+(r.fat||0)+'g'
      $('#mc-photo-slider').value=grams
      $('#mc-photo-grams').textContent=grams+'g'
      toast('识别完成: '+name+' '+grams+'g')
    }).catch(()=>{
      clearTimeout(timer)
      window._photoResult={name:'未识别菜品（点击修改）',estimated_grams:450,confidence:'low',calories:0,protein:0,carbs:0,fat:0}
      $('#mc-photo-name').textContent='未识别菜品（点击修改）'
      $('#mc-photo-conf').textContent='715kcal · 蛋白29g'
      toast('识别超时，请手动输入菜名')
    })
  }
  reader.readAsDataURL(file)
}
let _recalcTimer=null
function updatePhotoGrams(v){
  $('#mc-photo-grams').textContent=v+'g'
  let r=window._photoResult
  if(!r||!r.name)return
  $('#mc-photo-conf').textContent='🔄 AI 重新计算中...'
  clearTimeout(_recalcTimer)
  _recalcTimer=setTimeout(()=>{
    api('/api/recalc-nutrition',{method:'POST',body:JSON.stringify({name:r.name,grams:parseInt(v)})}).then(nut=>{
      if(!nut)return
      let cal=nut.calories||r.calories||0,pro=(nut.protein||r.protein||0).toFixed(1)
      let carbs=(nut.carbs||r.carbs||0).toFixed(1),fat=(nut.fat||r.fat||0).toFixed(1)
      $('#mc-photo-conf').textContent='✅ '+cal+'kcal · 蛋白'+pro+'g · 碳水'+carbs+'g · 脂肪'+fat+'g'
      r.calories=cal;r.protein=parseFloat(pro);r.carbs=parseFloat(carbs);r.fat=parseFloat(fat)
    }).catch(()=>{$('#mc-photo-conf').textContent='⚠️ 计算超时，将用估算值'})
  },400)
}
function clearPhotoCard(){
  $('#mc-photo-preview').classList.add('hidden')
  $('#mc-photo-name').textContent='--'
  window._photoResult=null
  let inp=document.getElementById('mc-photo');if(inp)inp.value=''
}
function showPhotoSkeleton(){
  $('#mc-photo-img').src=''
  $('#mc-photo-img').style.cssText='width:100%;height:150px;background:linear-gradient(90deg,#E5E5EA 25%,#F5F5F7 50%,#E5E5EA 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:12px'
  $('#mc-photo-preview').classList.remove('hidden')
  $('#mc-photo-name').textContent='AI 营养师分析中...'
  $('#mc-photo-conf').textContent='正在全速解析食材'
  $('#mc-photo-slider').value=300
  $('#mc-photo-grams').textContent='...'
}
function editPhotoName(){
  let el=$('#mc-photo-name'),old=el.textContent
  if(old==='识别中...'||old.includes('分析中'))return
  let inp=document.createElement('input')
  inp.className='input';inp.value=old==='--'||old.includes('未识别')||old.includes('超时')?'':old
  inp.style.cssText='font-size:16px;font-weight:600;padding:4px 8px;margin:-4px 0';inp.id='mc-photo-name-input'
  inp.onblur=function(){let v=this.value.trim()||'未识别菜品';el.textContent=v;this.replaceWith(el)}
  inp.onkeydown=function(e){if(e.key==='Enter')this.blur()}
  el.replaceWith(inp);inp.focus()
}
function addPhotoFood(){
  if(!window._photoResult)return toast('请先拍照识别')
  let g=parseInt($('#mc-photo-slider').value)
  let name=$('#mc-photo-name').textContent
  if(!name||name==='--'||name.includes('未识别')||name.includes('超时')||name.includes('识别中')){
    toast('请先点击菜名修改为正确名称')
    editPhotoName()
    return
  }
  let r=window._photoResult,mt=$('#mc-tp')?.value||'lunch',tm=$('#mc-tm')?.value||now()
  let cal=r?.calories||715,pro=r?.protein||29,carbs=r?.carbs||76,fat=r?.fat||28
  let foods=[{name:name,amount:g,calories:cal,protein:pro,carbs:carbs,fat:fat,unit:'g',dishName:name}]
  api('/api/meals',{method:'POST',body:JSON.stringify({date:T(),meal_type:mt,time:tm,foods:foods})}).then(()=>{
    api('/api/dishes',{method:'POST',body:JSON.stringify({name:name,foods:foods,calories:cal,protein:pro,carbs:carbs,fat:fat,tags:S.mode})})
    $('#mc-m').remove();loadAll().then(render)
    toast(name+' '+g+'g · '+cal+'kcal 已添加')
  }).catch(()=>toast('添加失败'))
}
function addIngredient(){
  let n=$('#mc-nm')?.value?.trim(),g=parseInt($('#mc-gr')?.value||100)
  if(!n)return toast('请输入食材名称');if(!g||g<1)return toast('请输入克数')
  clearPhotoCard()
  if(!window._ingredients)window._ingredients=[];window._ingredients.push(n+' '+g+'g');$('#mc-nm').value='';refreshIngredients();$('#mc-parse').style.display='block'
}
function refreshIngredients(){let h='';(window._ingredients||[]).forEach((ing,i)=>{h+=`<div class="food-row"><span>${ing}</span><button class="btn sm danger" onclick="removeIngredient(${i})">×</button></div>`});$('#mc-ings').innerHTML=h}
function removeIngredient(i){window._ingredients.splice(i,1);refreshIngredients();if(!window._ingredients.length)$('#mc-parse').style.display='none'}
function parseIngredients(){
  let txt=(window._ingredients||[]).join(', ');if(!txt)return
  toast('AI 正在计算...')
  api('/api/parse-food',{method:'POST',body:JSON.stringify({text:txt})}).then(r=>{
    if(r.foods&&r.foods.length){window._foods=r.foods;let cal=r.foods.reduce((s,f)=>s+(f.calories||0),0),pro=r.foods.reduce((s,f)=>s+(f.protein||0),0),carbs=r.foods.reduce((s,f)=>s+(f.carbs||0),0),fat=r.foods.reduce((s,f)=>s+(f.fat||0),0)
      $('#mc-res').innerHTML=`<div class="card" style="margin:8px 0 0;background:var(--divider)"><span class="c-title" style="color:var(--green)">✅ 解析完成</span><span class="c-val">${Math.round(cal)}</span><span class="c-unit"> kcal</span><div class="text-sm mt4">蛋白 ${pro.toFixed(1)}g · 碳水 ${carbs.toFixed(1)}g · 脂肪 ${fat.toFixed(1)}g</div></div>`
      toast(`解析完成 · ${Math.round(cal)}kcal`)
    }else toast('解析失败')
  })
}
function useDish(id){api('/api/dishes').then(ds=>{let d=ds.find(x=>x.id===id);if(!d)return;let fs;try{fs=JSON.parse(d.foods)}catch(e){return};window._foods=fs;window._ingredients=fs.map(f=>f.name+' '+f.amount+'g');$('#mc-dn').value=d.name;refreshIngredients();$('#mc-parse').style.display='none';$('#mc-res').innerHTML=`<div class="card" style="margin:8px 0 0;background:var(--divider)"><span class="c-title" style="color:var(--green)">已选用: ${d.name}</span><span class="c-val">${d.calories||0}</span><span class="c-unit"> kcal</span></div>`})}
function deleteDish(id){if(!confirm('删除？'))return;api('/api/dishes/'+id,{method:'DELETE'}).then(()=>{toast('已删除');api('/api/dishes?tag='+(S.mode||'happy')).then(ds=>{let el=$('#mc-dishes');if(el)el.innerHTML=(ds||[]).slice(0,10).map(d=>`<span style="display:inline-flex;align-items:flex-start;margin:0 6px 6px 0"><button class="chip" onclick="useDish(${d.id})" style="border-radius:20px 0 0 20px;margin:0">${d.name}<br><small>${d.calories}kcal</small></button><button class="chip" style="background:var(--red);color:#fff;border-radius:0 20px 20px 0;border:none;padding:7px 8px;font-size:11px" onclick="deleteDish(${d.id})">×</button></span>`).join('')})})}
function saveMeal(){
  let fs=window._foods||[];if(!fs.length)return toast('请先解析食材')
  let mt=$('#mc-tp')?.value||'lunch',tm=$('#mc-tm')?.value||now(),dn=$('#mc-dn')?.value?.trim()||fs.map(f=>f.name).join('+')
  fs.forEach(f=>{f.dishName=dn})
  api('/api/meals',{method:'POST',body:JSON.stringify({date:T(),meal_type:mt,time:tm,foods:fs})}).then(()=>{
    let cal=fs.reduce((s,f)=>s+(f.calories||0),0),pro=fs.reduce((s,f)=>s+(f.protein||0),0),car=fs.reduce((s,f)=>s+(f.carbs||0),0),fat=fs.reduce((s,f)=>s+(f.fat||0),0)
    api('/api/dishes',{method:'POST',body:JSON.stringify({name:dn,foods:fs,calories:Math.round(cal),protein:Math.round(pro*10)/10,carbs:Math.round(car*10)/10,fat:Math.round(fat*10)/10,tags:S.mode})})
    $('#mc-m').remove();loadAll().then(render);toast('已保存')
  })
}

// ── Workout modal ──
const CARDIO_PRESETS={running:{name:'跑步',emoji:'🏃',fields:['分钟','速度km/h']},
  walking:{name:'爬坡/快走',emoji:'🚶',fields:['分钟','坡度%','速度km/h']},
  cycling:{name:'动感单车',emoji:'🚴',fields:['分钟','阻力']},
  rowing:{name:'划船机',emoji:'🚣',fields:['分钟']},
  elliptical:{name:'椭圆机',emoji:'🧗',fields:['分钟','阻力']},
  jump:{name:'跳绳',emoji:'🪢',fields:['分钟']},
  swim:{name:'游泳',emoji:'🏊',fields:['分钟']}}
const STRENGTH_EXAMPLES=['卧推','深蹲','硬拉','引体向上','划船','推举','弯举','臂屈伸','卷腹','平板支撑']

function addWorkoutModal(){
  $('#app').insertAdjacentHTML('beforeend',`<div class="modal-overlay" id="wo-m"><div class="modal-box">
    <div class="modal-title">记录训练</div>
    <div class="flex g8 mb8"><select class="input sm" id="wo-tp" onchange="toggleWoType()"><option value="strength">💪 无氧</option><option value="cardio">🏃 有氧</option></select><span class="unit-wrap" style="width:90px"><input class="input sm" id="wo-dr" type="number" value="45" style="padding-right:28px;width:100%"><span class="unit-label">min</span></span><span class="unit-wrap" style="width:90px"><input class="input sm" id="wo-cal" type="number" value="300" style="padding-right:28px;width:100%" placeholder="估算"><span class="unit-label">kcal</span></span></div>
    <div id="wo-st"><span class="text-sub">动作</span><div id="wo-exs"></div><div class="chip-row mt8">${STRENGTH_EXAMPLES.map(e=>`<button class="chip" onclick="quickStrengthEx('${e}')">${e}</button>`).join('')}</div></div>
    <div id="wo-cd" class="hidden"><span class="text-sub">运动类型</span><div class="chip-row mt4">${Object.entries(CARDIO_PRESETS).map(([k,v])=>`<button class="chip" onclick="quickCardio('${k}')">${v.emoji} ${v.name}</button>`).join('')}</div><input class="input sm mt4 hidden" id="wo-custom-ex" placeholder="或手动输入运动名称"><div id="wo-segs"></div></div>
    <div class="flex g8 mt16"><button class="btn w100" onclick="$('#wo-m').remove()">取消</button><button class="btn primary w100" onclick="saveWorkout()">保存训练</button></div></div></div>`)
}
function toggleWoType(){
  let isCardio=$('#wo-tp').value==='cardio'
  $('#wo-st').classList.toggle('hidden',isCardio)
  $('#wo-cd').classList.toggle('hidden',!isCardio)
  if(isCardio&&!window._woType)quickCardio('running')
}
function quickStrengthEx(name){$('#wo-exs').innerHTML+=`<div class="input-row mt8"><input class="input" value="${name}"><span class="unit-wrap" style="width:60px"><input class="input sm" type="number" value="4" style="padding-right:24px"><span class="unit-label">组</span></span><span class="unit-wrap" style="width:60px"><input class="input sm" type="number" value="12" style="padding-right:24px"><span class="unit-label">次</span></span><span class="unit-wrap" style="width:60px"><input class="input sm" type="number" value="0" style="padding-right:24px"><span class="unit-label">kg</span></span></div>`}
function quickCardio(key){
  window._woType=key
  let p=CARDIO_PRESETS[key],dur=parseInt($('#wo-dr')?.value||45)
  $('#wo-cal').value='...'  // Will be AI-computed
  $('#wo-custom-ex').classList.add('hidden')
  $('#wo-segs').innerHTML=`<div class="card mt8" style="background:var(--divider)"><span style="font-size:18px">${p.emoji} ${p.name}</span><span class="text-sub ml-auto">消耗将由AI计算</span></div>`
  p.fields.forEach(f=>{$('#wo-segs').innerHTML+=`<div class="input-row mt4"><span class="text-sm text-sub" style="width:60px">${f}</span><input class="input sm" type="number" value="${f.includes('分钟')?dur:3}" style="flex:1"></div>`})
  $('#wo-segs').innerHTML+=`<button class="btn outline sm mt4" onclick="quickCardioCustom()">+ 自定义运动</button>`
  // Trigger AI calorie estimate
  estimateCalories()
}
let _estTimer=null
function estimateCalories(){
  clearTimeout(_estTimer)
  _estTimer=setTimeout(()=>{
    let dur=parseInt($('#wo-dr')?.value||45),tp=$('#wo-tp')?.value||'strength'
    let name=tp==='cardio'?(CARDIO_PRESETS[window._woType]?.name||$('#wo-custom-ex').value.trim()||'有氧'):'力量训练'
    if(!name)return
    let desc=name+' '+dur+'分钟'
    if(tp==='strength'){
      let exs=[]
      $('#wo-exs').querySelectorAll('.input-row').forEach(r=>{let inps=r.querySelectorAll('input');exs.push(inps[0]?.value?.trim()||'训练')})
      desc=tp==='strength'&&exs.length?exs.join(',')+' 共'+dur+'分钟':'力量训练 '+dur+'分钟'
    }
    api('/api/workout-calories',{method:'POST',body:JSON.stringify({weight:S.user?.current_weight||70,description:desc})}).then(r=>{
      if(r.calories)$('#wo-cal').value=r.calories
    }).catch(()=>{})
  },300)
}
$('#wo-dr')?.addEventListener('input',estimateCalories)
function quickCardioCustom(){
  $('#wo-custom-ex').classList.remove('hidden')
  $('#wo-custom-ex').focus()
  $('#wo-cal').val(300)
}
$('#wo-dr')?.addEventListener('input',function(){if(window._woType)quickCardio(window._woType)})
function saveWorkout(){
  let tp=$('#wo-tp')?.value||'strength',dr=parseInt($('#wo-dr')?.value)||45,cal=parseInt($('#wo-cal')?.value)||300,u=S.user||{},exs=[],desc=''
  if(tp==='strength'){
    $('#wo-exs').querySelectorAll('.input-row').forEach(r=>{let inps=r.querySelectorAll('input');let n=inps[0]?.value?.trim()||'训练',s=parseInt(inps[1]?.value)||4,re=parseInt(inps[2]?.value)||12,w=parseInt(inps[3]?.value)||0;exs.push({name:n,sets:s,reps:re,weight:w});desc+=n+' '+s+'组×'+re+'次×'+w+'kg; '})
  }else{
    let ename=$('#wo-custom-ex').value.trim()||(CARDIO_PRESETS[window._woType]?.name)||'有氧'
    let fields=[]
    $('#wo-segs').querySelectorAll('.input-row input').forEach(inp=>fields.push(inp.value||0))
    exs.push({name:ename,fields:fields})
    desc=ename+' 参数:'+fields.join('/')+' '
  }
  if(!exs.length)return toast('请添加训练内容')
  desc+='总时长'+dr+'min'
  toast('AI 计算消耗中...')
  api('/api/workout-calories',{method:'POST',body:JSON.stringify({weight:u.current_weight||70,description:desc})}).then(r=>{
    let finalCal=r.calories||cal
    api('/api/workouts',{method:'POST',body:JSON.stringify({date:T(),start_time:now(),duration:dr,type:tp,exercises:JSON.stringify(exs),calories:finalCal})}).then(()=>{$('#wo-m').remove();loadAll().then(render);toast('训练完成 · '+finalCal+'kcal '+r.note||'')})
  }).catch(()=>{
    api('/api/workouts',{method:'POST',body:JSON.stringify({date:T(),start_time:now(),duration:dr,type:tp,exercises:JSON.stringify(exs),calories:cal})}).then(()=>{$('#wo-m').remove();loadAll().then(render);toast('训练已记录 · '+cal+'kcal')})
  })
}

// ── Boot ──
render()
loadAll().then(render).catch(render)
</script>
</body>
</html>
