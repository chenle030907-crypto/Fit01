<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fit No.1</title>
<style>
:root{--bg:#F2F2F7;--card:#FFFFFF;--text:#1C1C1E;--sub:#8E8E93;--ter:#C7C7CC;--border:rgba(60,60,67,.1);--divider:rgba(60,60,67,.06);--fill:rgba(120,120,128,.12);--green:#34C759;--orange:#FF9500;--blue:#007AFF;--red:#FF3B30;--indigo:#5856D6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);font-size:17px;line-height:1.47059;font-weight:400;letter-spacing:-0.022em;-webkit-font-smoothing:antialiased}
.page{max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:100px}
/* Nav */
.nav{position:sticky;top:0;z-index:10;background:rgba(242,242,247,.8);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.nav-t{font-size:17px;font-weight:600;letter-spacing:-0.022em}
/* Cards */
.card{background:var(--card);margin:16px 16px 0;padding:16px 20px;border-radius:16px}
.card:last-child{margin-bottom:16px}
.c-title{font-size:13px;color:var(--sub);font-weight:500;text-transform:uppercase;letter-spacing:-0.01em;margin-bottom:8px}
.c-val{font-size:28px;font-weight:600;letter-spacing:-0.022em}
/* Mode bar */
.mode-bar{display:flex;align-items:center;gap:12px;padding:16px 20px;border-radius:16px;margin:16px 16px 0;cursor:pointer;transition:opacity .15s}
.mode-bar:active{opacity:.7}
.mode-emoji{font-size:28px;line-height:1}
.mode-label{font-size:17px;font-weight:600;flex:1}
.mode-desc{font-size:13px;color:var(--sub);margin-top:2px;font-weight:400}
/* Macro */
.macro-row{display:flex;gap:12px;margin:16px 16px 0}
.macro-item{flex:1;background:var(--card);border-radius:16px;padding:16px;text-align:center}
.macro-val{font-size:17px;font-weight:600;display:block}
.macro-lbl{font-size:12px;color:var(--sub);margin-top:4px;display:block;font-weight:400}
/* Buttons */
.btn-row{display:flex;gap:12px;margin:16px 16px 0}
.btn{flex:1;padding:13px 20px;border-radius:12px;text-align:center;font-size:17px;font-weight:500;border:none;cursor:pointer;background:var(--fill);color:var(--text);letter-spacing:-0.022em;transition:opacity .15s}
.btn:active{opacity:.6}
.btn.primary{background:var(--text);color:#fff}
.btn.outline{background:transparent;border:1px solid var(--border)}
.btn.danger{color:var(--red)}
.btn.sm{padding:8px 14px;font-size:15px;flex:0;border-radius:10px}
.btn.w100{width:100%;flex:none}
/* Inputs */
.input{padding:12px 16px;border:none;border-radius:10px;font-size:17px;background:var(--fill);color:var(--text);outline:none;width:100%;letter-spacing:-0.022em;transition:background .15s}
.input:focus{background:rgba(120,120,128,.18)}
.input.sm{padding:10px 14px;font-size:15px;border-radius:8px}
select.input{-webkit-appearance:none;appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%238E8E93' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;padding-right:32px}
.input-row{display:flex;gap:8px;align-items:center}
/* Utilities */
.flex{display:flex}.g8{gap:8px}.w100{width:100%}
.text-center{text-align:center}.text-sub{color:var(--sub);font-size:13px}.text-sm{font-size:13px}.text-right{text-align:right}
.ml-auto{margin-left:auto}.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}
.big-num{font-size:48px;font-weight:700;letter-spacing:-0.022em}
/* Chips */
.chip-row{display:flex;gap:6px;overflow-x:auto;padding:4px 0;flex-wrap:wrap}
.chip{background:var(--fill);border:none;border-radius:20px;padding:8px 14px;font-size:14px;white-space:nowrap;cursor:pointer;color:var(--text);transition:opacity .15s;letter-spacing:-0.01em}
.chip:active{opacity:.6}
.chip.active{background:var(--text);color:#fff}
/* Food rows */
.food-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:.33px solid var(--divider)}
.food-row:last-child{border-bottom:none}
/* Bottom nav */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(242,242,247,.8);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.33px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom,0)}
.tab{flex:1;text-align:center;padding:8px 0 4px;font-size:10px;color:var(--sub);cursor:pointer;font-weight:500;letter-spacing:.01em}
.tab.active{color:var(--green)}
.tab-icon{font-size:24px;display:block;margin-bottom:2px;line-height:1}
/* Toast */
.toast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:rgba(28,28,30,.92);color:#fff;padding:10px 24px;border-radius:24px;font-size:14px;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;backdrop-filter:blur(10px);letter-spacing:-0.01em}
.toast.show{opacity:1}
/* Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.3);display:flex;align-items:flex-end;justify-content:center;z-index:100;animation:fadeIn .2s}
.modal-box{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:430px;max-height:90vh;display:flex;flex-direction:column;animation:slideUp .3s ease-out}
.modal-body{padding:24px 20px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;max-height:60vh}
.modal-footer{padding:16px 20px 34px;border-top:.33px solid var(--divider);flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:12px}
.modal-footer .btn-primary{width:100%}
.cancel-btn{background:none;border:none;color:var(--sub);padding:8px;cursor:pointer;font-size:15px}
.modal-title{font-size:17px;font-weight:600;margin-bottom:20px;text-align:center;letter-spacing:-0.022em}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.hidden{display:none!important}
.bold{font-weight:600}
/* Unit labels */
.unit-wrap{position:relative;display:inline-block}
.unit-label{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:12px;pointer-events:none;font-weight:500}
/* Progress */
.progress-bar{height:6px;background:var(--fill);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .4s ease-out}
/* Ruler */
.ruler-wrap{position:relative;height:80px;overflow:hidden;margin:0;user-select:none;-webkit-user-select:none;touch-action:pan-x;cursor:grab}
.ruler-wrap:active{cursor:grabbing}
.ruler-wrap::before,.ruler-wrap::after{content:'';position:absolute;top:0;bottom:0;width:50px;z-index:2;pointer-events:none}
.ruler-wrap::before{left:0;background:linear-gradient(to right,var(--card) 0%,transparent 100%)}
.ruler-wrap::after{right:0;background:linear-gradient(to left,var(--card) 0%,transparent 100%)}
.ruler-track{display:flex;align-items:flex-end;height:100%;padding:0 50%}
.ruler-tick{flex-shrink:0}
.ruler-tick.major{height:42px;background:var(--text);width:1.5px}
.ruler-tick.mid{height:28px;background:var(--sub);width:1px}
.ruler-tick.minor{height:16px;background:var(--ter);width:.5px}
.ruler-indicator{position:absolute;left:50%;top:0;bottom:0;width:2.5px;background:var(--green);transform:translateX(-50%);z-index:3;border-radius:2px;box-shadow:0 0 12px rgba(52,199,89,.25)}
.ruler-value{text-align:center;font-size:36px;font-weight:700;margin:8px 0 0;font-variant-numeric:tabular-nums;letter-spacing:-0.022em}
.ruler-unit{text-align:center;font-size:13px;color:var(--sub);margin-bottom:4px;font-weight:500}
.ruler-label-row{display:flex;justify-content:space-between;padding:0 20px;margin-top:4px}
.ruler-label{font-size:10px;color:var(--ter);font-weight:500}
/* Shimmer */
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<div class="page" id="app"></div>
<div class="bottom-nav" id="nav"></div>
<div class="toast" id="toast"></div>
<script>
// ── State & Utils ──
const T=()=>new Date().toISOString().slice(0,10)
const now=()=>new Date().toTimeString().slice(0,5)
const $=s=>document.querySelector(s)
const $$=s=>document.querySelectorAll(s)
const api=(u,o={})=>fetch(u,{headers:{'Content-Type':'application/json'},...o}).then(r=>r.ok?r.json():Promise.reject(r))
const toast=m=>{let t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}

const MODES={cardio:{l:'有氧日',e:'🏃',d:'高碳水供能',bg:'rgba(0,122,255,.08)',c:'#007AFF'},
  strength:{l:'无氧日',e:'💪',d:'高蛋白修复',bg:'rgba(255,149,0,.08)',c:'#FF9500'},
  happy:{l:'Happy日',e:'😊',d:'休息恢复',bg:'rgba(52,199,89,.08)',c:'#34C759'},
  cheat:{l:'放纵日',e:'🎉',d:'随便吃',bg:'rgba(255,59,48,.08)',c:'#FF3B30'}}

let S={tab:'home',user:{},meals:[],workouts:[],dishes:[],goals:{},mode:'happy',measurements:[],water:[],waterTarget:2500,waterDrinks:[],steps:0,stepCal:0,history:[]}

const CARDIO_PRESETS={running:{name:'跑步',emoji:'🏃',fields:['分钟','速度km/h']},
  walking:{name:'爬坡/快走',emoji:'🚶',fields:['分钟','坡度%','速度km/h']},
  cycling:{name:'动感单车',emoji:'🚴',fields:['分钟','阻力']},
  rowing:{name:'划船机',emoji:'🚣',fields:['分钟']},
  elliptical:{name:'椭圆机',emoji:'🧗',fields:['分钟','阻力']},
  jump:{name:'跳绳',emoji:'🪢',fields:['分钟']},
  swim:{name:'游泳',emoji:'🏊',fields:['分钟']}}
const STRENGTH_EXAMPLES=['卧推','深蹲','硬拉','引体向上','划船','推举','弯举','臂屈伸','卷腹','平板支撑']

// ── Nav ──
function nav(){
  let h='';['home','diet','workout','me'].forEach(t=>{
    let ic={home:'📊',diet:'🍽️',workout:'💪',me:'👤'},lb={home:'首页',diet:'饮食',workout:'运动',me:'我的'}
    h+=`<div class="tab ${S.tab===t?'active':''}" data-t="${t}"><span class="tab-icon">${ic[t]}</span>${lb[t]}</div>`
  })
  $('#nav').innerHTML=h
  $$('.tab').forEach(t=>t.onclick=()=>{S.tab=t.dataset.t;render()})
}
function render(){S.tab==='home'?home():S.tab==='diet'?diet():S.tab==='workout'?workout():me();nav()}
function renderMacroBar(label,val,target,color){
  let pct=target>0?Math.min(150,Math.round(val/target*100)):0
  let barColor=pct<80?'var(--blue)':pct<=100?'var(--green)':'var(--orange)'
  return `<div class="macro-item"><span class="macro-val" style="color:${color}">${val}</span><span class="macro-lbl">${label} / ${target}g</span><div class="progress-bar" style="height:4px;margin-top:6px"><div class="progress-fill" style="width:${Math.min(pct,100)}%;background:${barColor}"></div></div><span class="text-sm" style="color:${barColor}">${pct}%</span></div>`
}

// ── Home ──
function home(){
  let m=S.mode||'happy',c=MODES[m],g=S.goals||{}
  let eaten=S.mealsTotal||0,wb=(S.workouts||[]).reduce((s,w)=>s+(w.calories||0),0)
  let totalBurn=wb+(S.stepCal||0),netCal=eaten-totalBurn
  let remaining=(g.target_calories||2000)-eaten+totalBurn
  let netColor=netCal<0?'var(--green)':netCal>500?'var(--red)':'var(--orange)'
  let eff=S.water.reduce((s,w)=>s+(w.effective_ml||w.amount||0),0),raw=S.water.reduce((s,w)=>s+(w.amount||0),0)
  let wt=S.waterTarget||2500,pct=Math.min(100,Math.round(eff/wt*100))
  let bc=pct<30?'var(--red)':pct<70?'var(--orange)':'var(--green)'
  let lw=S.measurements&&S.measurements[0]?S.measurements[0].weight:(S.user.current_weight||0)
  $('#app').innerHTML=`
    <div class="nav"><span class="nav-t">Fit No.1</span><span class="text-sub">${T()}</span></div>
    <div class="mode-bar" style="background:${c.bg}" onclick="switchMode()"><span class="mode-emoji">${c.e}</span><div><span class="mode-label" style="color:${c.c}">${c.l}</span><span class="mode-desc">${c.d} · 点击切换</span></div></div>
    <div class="card"><span class="c-title">今日能量总览</span>
      <div class="food-row"><span>还可以吃</span><span class="bold" style="color:var(--green);font-size:20px">${Math.max(0,remaining)} kcal</span></div>
      <div class="food-row"><span>净热量</span><span class="bold" style="color:${netColor}">${netCal>0?'+':''}${netCal} kcal</span></div>
      <div class="food-row"><span>饮食摄入</span><span class="bold">${eaten} kcal</span></div>
      <div class="food-row" style="border-bottom:none"><span>运动消耗 · 训练${wb}kcal + 步数${S.stepCal||0}kcal</span><span class="bold" style="color:var(--red)">-${totalBurn} kcal</span></div>
    </div>
    ${g.coachAdvice?`<div class="card" style="background:var(--fill);margin-top:8px"><span class="text-sm">💬 ${g.coachAdvice}</span></div>`:''}
    <div class="macro-row">${renderMacroBar('蛋白',Math.round(S.mealsProtein||0),g.protein||0,'var(--orange)')}${renderMacroBar('碳水',Math.round(S.mealsCarbs||0),g.carbs||0,'var(--green)')}${renderMacroBar('脂肪',Math.round(S.mealsFat||0),g.fat||0,'var(--blue)')}</div>
    ${renderHistory()}
    <div class="card"><span class="c-title">🚶 步数</span><div style="display:flex;align-items:baseline;gap:8px;margin:8px 0"><span class="c-val">${(S.steps||0).toLocaleString()}</span><span class="text-sub">步</span><span class="text-sm" style="color:var(--orange);margin-left:auto">消耗 ≈${S.stepCal||0} kcal</span></div><div class="input-row mt8"><input class="input sm" id="step-in" type="number" placeholder="步数" value="" style="flex:1;text-align:center;font-size:18px;font-weight:600"><button class="btn primary sm" onclick="recordSteps()">更新</button></div></div>
    <div class="card"><span class="c-title">💧 饮水 · ${pct}%</span>
      <div style="display:flex;align-items:baseline;gap:8px;margin:8px 0"><span class="c-val">${eff}</span><span class="text-sub">/ ${wt} ml</span></div>
      ${raw!==eff?`<div class="text-sm text-sub" style="margin-bottom:6px">实际 ${raw}ml，等效纯水 ${eff}ml</div>`:''}
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${bc}"></div></div>
      <div class="input-row mt12" style="flex-wrap:wrap">
        <span class="unit-wrap" style="flex:1"><input class="input sm" id="w-amt" value="250" type="number" style="width:100%;text-align:center;font-size:18px;font-weight:600;padding-right:28px"><span class="unit-label">ml</span></span>
        <select class="input sm" id="w-type" onchange="toggleCustomDrink()" style="flex:1">${(S.waterDrinks||[]).map(d=>`<option>${d.name}</option>`).join('')}<option>其他</option></select>
        <input class="input sm hidden" id="w-custom" placeholder="饮品名" style="width:100px">
        <button class="btn primary sm" onclick="quickAddWater()" style="flex:0 0 44px">+</button>
      </div>
      <div class="text-sm text-sub mt8">${S.water&&S.water.length>0?S.water.slice(-3).reverse().map(w=>`<span style="cursor:pointer" onclick="undoWater(${w.id})">${w.drink_type} ${w.amount}ml${w.effective_ml!==w.amount?'→'+w.effective_ml+'ml':''} ✕</span>`).join(' · '):'今天还没喝水'}</div>
      <div class="flex g8 mt8"><button class="btn sm outline" onclick="quickWaterFixed(200)">💧200ml</button><button class="btn sm outline" onclick="quickWaterFixed(350)">💧350ml</button><button class="btn sm outline" onclick="quickWaterFixed(500)">💧500ml</button></div>
    </div>
    <div class="btn-row"><button class="btn primary" onclick="S.tab='diet';render()">🍽️ 记录饮食</button><button class="btn primary" onclick="S.tab='workout';render()">💪 记录运动</button></div>
    ${lw?`<div class="card" onclick="S.tab='me';render()"><span class="c-title">最新体重</span><span class="c-val">${lw}kg</span></div>`:''}
  `
}

// ── Diet ──
function diet(){
  let tp={breakfast:'早餐',lunch:'午餐',dinner:'晚餐',snack:'加餐'},mb={breakfast:[],lunch:[],dinner:[],snack:[]}
  S.meals.forEach(m=>{if(mb[m.meal_type])mb[m.meal_type].push(m)})
  let h=`<div class="nav"><span class="nav-t">饮食</span><span class="text-sub">${T()}</span></div>
    <div class="card text-center"><span class="c-title">今日摄入</span><span class="big-num">${S.mealsTotal||0}</span><span class="c-unit"> kcal</span></div>`
  Object.entries(tp).forEach(([t,lb])=>{
    let ml=mb[t]||[]
    h+=`<div class="card"><span class="c-title">${lb} · ${ml.length}餐</span>`
    if(!ml.length)h+=`<div class="text-sub" style="padding:8px 0">暂无记录</div>`
    else ml.forEach(m=>{
      let fs=[];try{fs=JSON.parse(m.foods)}catch(e){}
      let cal=fs.reduce((s,f)=>s+(f.calories||0),0),pro=fs.reduce((s,f)=>s+(f.protein||0),0)
      let dn=fs[0]?.dishName||fs.map(f=>f.name).join('+')
      h+=`<div class="food-row"><div><span>${m.time||''}</span><span class="text-sm bold" style="margin-left:8px">${dn}</span><div class="text-sm text-sub">${fs.map(f=>f.name+' '+f.amount+'g').join(' · ')}</div></div><div class="text-right"><span class="bold">${cal}kcal</span><br><span class="text-sm text-sub">蛋白${pro.toFixed(1)}g</span><br><button class="btn sm danger" onclick="delMeal(${m.id})">×</button></div></div>`
    })
    h+=`</div>`
  })
  h+=`<div style="padding:16px 16px 0"><button class="btn primary w100" onclick="addMealModal()">+ 添加饮食</button></div>`
  $('#app').innerHTML=h
}

// ── Workout ──
function workout(){
  let h=`<div class="nav"><span class="nav-t">运动</span><span class="text-sub">${T()}</span></div>`
  if(!S.workouts.length)h+=`<div class="card"><div class="text-sub text-center" style="padding:20px">暂无训练记录</div></div>`
  else S.workouts.forEach(w=>{
    let exs=w.exercises;if(typeof exs==='string')try{exs=JSON.parse(exs)}catch(e){exs=[]};if(!Array.isArray(exs))exs=[]
    let ic=w.type==='cardio'
    h+=`<div class="card"><span class="c-title">${w.start_time||''} · ${w.duration||0}分钟 · ${ic?'🏃 有氧':'💪 无氧'}</span><div class="mt8">${exs.map(e=>ic?`<span class="chip">${e.name||'有氧'}</span>${e.segments?`<div class="text-sm text-sub mt4">${e.segments.map(s=>s.name+' '+s.minutes+'min').join(' | ')}</div>`:''}`:`<span class="chip">${e.name} ${e.sets||0}组×${e.reps||0}次×${e.weight||0}kg</span>`).join(' ')}</div><div class="flex" style="justify-content:space-between;margin-top:8px"><span class="bold" style="color:var(--red)">-${w.calories||0} kcal</span><button class="btn sm danger" onclick="delWorkout(${w.id})">删除</button></div></div>`
  })
  h+=`<div style="padding:16px 16px 0"><button class="btn primary w100" onclick="addWorkoutModal()">+ 记录训练</button></div>`
  $('#app').innerHTML=h
}

// ── Me ──
function me(){
  let u=S.user||{},g=S.goals||{},lw=S.measurements&&S.measurements[0]?S.measurements[0]:{}
  let h=`<div class="nav"><span class="nav-t">我的</span></div>
    <div class="card text-center"><span style="font-size:22px;font-weight:700">${u.nickname||'健身者'}</span></div>
    <div class="card"><span class="c-title">身体数据</span>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px">
        <div><span class="text-sub">身高</span><br><span class="bold">${u.height||170}cm</span></div>
        <div><span class="text-sub">体重</span><br><span class="bold">${lw.weight||u.current_weight||70}kg</span></div>
        <div><span class="text-sub">目标</span><br><span class="bold">${u.target_weight||65}kg</span></div>
        <div><span class="text-sub">年龄</span><br><span class="bold">${new Date().getFullYear()-parseInt((u.birth_date||'1995').slice(0,4))}岁</span></div>
      </div>
      <button class="btn outline w100 mt12" onclick="editProfile()">编辑资料</button>
    </div>

// ── Ruler ──
function initRulers(){
  let u=S.user||{},lw=S.measurements&&S.measurements[0]?S.measurements[0]:{}
  buildRuler('wt',lw.weight||u.current_weight||70,30,150,0.1)
  buildRuler('bf',lw.body_fat||18,5,50,0.1)
}
function buildRuler(id,val,min,max,step){
  let track=$('#'+id+'-track'),wrap=$('#'+id+'-ruler'),valEl=$('#'+id+'-val')
  if(!track||!wrap)return
  let totalTicks=Math.round((max-min)/step),html=''
  for(let i=0;i<=totalTicks;i++){
    let cls=i%10===0?'major':i%5===0?'mid':'minor'
    html+=`<div class="ruler-tick ${cls}"></div>`
  }
  track.innerHTML=html;track.style.gap='6px'
  let pxPerTick=7,tickIdx=Math.round((val-min)/step)
  window['_'+id+'Val']=val
  if(valEl)valEl.textContent=val.toFixed(1)
  function sync(){
    let rect=track.getBoundingClientRect(),wr=wrap.getBoundingClientRect()
    let cx=wr.left+wr.width/2,offset=cx-rect.left
    let idx=Math.max(0,Math.min(totalTicks,Math.round(offset/pxPerTick)))
    let v=Math.round((min+idx*step)*10)/10
    if(valEl)valEl.textContent=v.toFixed(1)
    window['_'+id+'Val']=v
  }
  wrap.scrollLeft=tickIdx*pxPerTick
  wrap.onscroll=sync
  wrap.addEventListener('touchmove',sync,{passive:true})
  let dragging=false,sx=0,sl=0
  wrap.addEventListener('pointerdown',e=>{dragging=true;sx=e.clientX;sl=wrap.scrollLeft;wrap.setPointerCapture(e.pointerId)})
  wrap.addEventListener('pointermove',e=>{if(dragging){wrap.scrollLeft=sl+(sx-e.clientX);sync()}})
  wrap.addEventListener('pointerup',()=>{dragging=false})
  setTimeout(sync,300)
}

function renderHistory(){
  let h=S.history||[];if(!h.length)return''
  let u=S.user||{},td=u.target_date||''
  let daysLeft='';if(td){try{let t=new Date(td),now=new Date();daysLeft=Math.ceil((t-now)/86400000);daysLeft=daysLeft>0?'剩'+daysLeft+'天':'已到期'}catch(e){}}
  let pts=h.map(r=>r.actualCaloriesIn-(r.actualCaloriesBurn||0))
  let maxV=Math.max(...pts,500),minV=Math.min(...pts,0),range=maxV-minV||1,W=320,H=160,P=10
  let toX=i=>P+(W-2*P)*i/(pts.length-1||1)
  let toY=v=>P+(H-2*P)*(1-(v-minV)/range)
  let pathD=pts.map((v,i)=>`${i===0?'M':'L'}${toX(i).toFixed(1)},${toY(v).toFixed(1)}`).join(' ')
  let areaD=`M${toX(0).toFixed(1)},${H-P}L${pathD.slice(1)}L${toX(pts.length-1).toFixed(1)},${H-P}Z`
  let lbls='';let step=Math.max(1,Math.floor((pts.length-1)/5))
  for(let i=0;i<pts.length;i+=step){let d=new Date(h[i].date);lbls+=`<text x="${toX(i).toFixed(1)}" y="${H-2}" text-anchor="middle" fill="#86868b" font-size="10">${(d.getMonth()+1)}/${d.getDate()}</text>`}
  return`<div class="card" style="margin-top:0"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><span class="c-title">周期趋势复盘</span>${td?`<span style="font-size:12px;color:var(--blue);font-weight:500;background:rgba(0,122,255,.1);padding:2px 8px;border-radius:20px">目标日:${td.slice(5)} (${daysLeft})</span>`:''}</div><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0071e3" stop-opacity=".12"/><stop offset="100%" stop-color="#0071e3" stop-opacity="0"/></linearGradient></defs><path d="${areaD}" fill="url(#ag)"/><path d="${pathD}" fill="none" stroke="#0071e3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${lbls}</svg></div>`
}

function loadRecommendations(){

      </div>`

function updateTotalDuration(){
  let total=0
  $('#wo-segs').querySelectorAll('.seg-dur').forEach(inp=>{total+=parseInt(inp.value)||0})
  if($('#wo-segs').children.length>0){$('#wo-dr').value=total;$('#wo-dr').disabled=true}
  else{$('#wo-dr').disabled=false}
}
function estimateCalories(){
  let tp=$('#wo-tp')?.value||'strength',desc=''
  if(tp==='cardio'){
    let dur=parseInt($('#wo-dr')?.value||0)
    if(!dur||dur<1)return toast('请先输入有氧运动时间')
    let segs=[]
    $('#wo-segs').querySelectorAll('.card').forEach(card=>{
      let inps=card.querySelectorAll('input');let n=inps[0]?.value?.trim()||card.querySelector('span')?.textContent?.trim()||'有氧'
      let d=parseInt(inps[1]?.value)||0;if(d>0)segs.push(n+' '+d+'min')
    })
    desc=segs.length?segs.join(', ')+' 总'+dur+'分钟':'有氧 '+dur+'分钟'
  }else{
    let hasValid=false,parts=[]
    $('#wo-exs').querySelectorAll('.card').forEach(card=>{
      let inps=card.querySelectorAll('input');let n=inps[0]?.value?.trim()||''
      let s=parseInt(inps[1]?.value)||0,re=parseInt(inps[2]?.value)||0,w=parseInt(inps[3]?.value)||0
      if(n&&s>0){hasValid=true;parts.push(n+' '+s+'组×'+re+'次×'+w+'kg')}
    })
    if(!hasValid)return toast('请先添加至少一个训练动作和组数')
    desc=parts.join(', ')
  }
  $('#wo-cal').value='...'
  let payload={weight:S.user?.current_weight||70,height:S.user?.height||170,type:tp,description:desc}
  // Add detailed exercise data for AI precision
  if(tp==='cardio'){
    let dur=parseInt($('#wo-dr')?.value||0);payload.duration=dur
    let segs=[]
    $('#wo-segs').querySelectorAll('.card').forEach(card=>{
      let inps=card.querySelectorAll('input');let n=inps[0]?.value?.trim()||card.querySelector('span')?.textContent?.trim()||'有氧'
      let d=parseInt(inps[1]?.value)||0;if(d>0)segs.push({name:n,minutes:d})
    })
    payload.segments=segs
  }else{
    let actions=[]
    $('#wo-exs').querySelectorAll('.card').forEach(card=>{
      let inps=card.querySelectorAll('input');let n=inps[0]?.value?.trim()||'',s=parseInt(inps[1]?.value)||0
      let re=parseInt(inps[2]?.value)||0,w=parseInt(inps[3]?.value)||0
      if(n&&s>0)actions.push({name:n,sets:s,reps:re,weight:w})
    })
    payload.exercises=actions
  }
  api('/api/workout-calories',{method:'POST',body:JSON.stringify(payload)}).then(r=>{
    if(r.calories){$('#wo-cal').value=r.calories;toast(`AI估算: ${r.calories}kcal${r.note?' · '+r.note:''}`)}
    else{$('#wo-cal').value=300}
  }).catch(()=>{$('#wo-cal').value=300})
}
function saveWorkout(){
  let tp=$('#wo-tp')?.value||'strength',dr=parseInt($('#wo-dr')?.value)||(tp==='cardio'?45:0),cal=parseInt($('#wo-cal')?.value)||0,u=S.user||{},exs=[],desc=''
  if(tp==='strength'){dr=0
    $('#wo-exs').querySelectorAll('.card').forEach(card=>{let inps=card.querySelectorAll('input');let n=inps[0]?.value?.trim()||'训练',s=parseInt(inps[1]?.value)||4,re=parseInt(inps[2]?.value)||12,w=parseInt(inps[3]?.value)||0;exs.push({name:n,sets:s,reps:re,weight:w});desc+=n+' '+s+'组×'+re+'次×'+w+'kg; '})
  }else{
    let segs=[];let allNames=[]
    $('#wo-segs').querySelectorAll('.card').forEach(card=>{
      let inps=card.querySelectorAll('input')
      let n=inps[0]?.value?.trim()||card.querySelector('span')?.textContent?.trim()||'有氧'
      let d=parseInt(inps[1]?.value)||0
      segs.push({name:n,minutes:d});allNames.push(n+' '+d+'min')
    })
    if(!segs.length){segs.push({name:'有氧',minutes:dr});allNames.push('有氧 '+dr+'min')}
    let comboName=allNames.length>1?'组合有氧':segs[0].name
    exs.push({name:comboName,segments:segs})
    desc=allNames.join(' / ')+' 总'+dr+'min'
  }
  if(!exs.length)return toast('请添加训练内容')
  desc+='总时长'+dr+'min'
  toast('AI 计算消耗中...')
  api('/api/workout-calories',{method:'POST',body:JSON.stringify({weight:u.current_weight||70,description:desc})}).then(r=>{
    let finalCal=r.calories||cal
    api('/api/workouts',{method:'POST',body:JSON.stringify({date:T(),start_time:now(),duration:dr,type:tp,exercises:JSON.stringify(exs),calories:finalCal})}).then(()=>{$('#wo-m').remove();loadAll().then(render);toast('训练完成 · '+finalCal+'kcal')})
  }).catch(()=>{
    api('/api/workouts',{method:'POST',body:JSON.stringify({date:T(),start_time:now(),duration:dr,type:tp,exercises:JSON.stringify(exs),calories:cal})}).then(()=>{$('#wo-m').remove();loadAll().then(render);toast('训练已记录 · '+cal+'kcal')})
  })
}

// ── Boot ──
render()
loadAll().then(render).catch(render)
</script>
